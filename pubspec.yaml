name: flutter_alpr
description: On-device license plate recognition (ALPR/ANPR) for Flutter on iOS and Android. Fully offline, 65 countries.
version: 0.4.0
homepage: https://alpr.parkr.app
repository: https://github.com/parkr-app/flutter_alpr
issue_tracker: https://github.com/parkr-app/flutter_alpr/issues
documentation: https://github.com/parkr-app/flutter_alpr#readme
topics: [alpr, anpr, license-plate, ocr, camera]

environment:
  sdk: ^3.5.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: app.parkr.alpr.flutter
        pluginClass: FlutterAlprPlugin
      ios:
        pluginClass: FlutterAlprPlugin
